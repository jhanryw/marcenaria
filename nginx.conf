# Marcenaria — nginx para o export estático do Next.js (output: 'export', trailingSlash: true).
# Instalado em /etc/nginx/conf.d/ (contexto http) pelo Dockerfile; por isso pode conter `map` e `server`.

# ---- Política de cache ------------------------------------------------------
#  - /_next/static/*  : arquivos com hash no nome -> imutáveis, cache de 1 ano
#  - /icons/, /fonts/ : não têm hash, mas quase nunca mudam (e o service worker os pré-cacheia) -> 7 dias
#  - todo o resto     : HTML, manifest, sw.js, payloads RSC (.txt) -> "no-cache" = o navegador
#                       SEMPRE revalida (ETag/304), então atualizações e novo service worker são vistos na hora
map $uri $cache_control {
    default                 "no-cache";
    ~^/_next/static/        "public, max-age=31536000, immutable";
    ~^/(icons|fonts)/       "public, max-age=604800";
}

server {
    # Só IPv4: `listen [::]:80` derruba o nginx em hosts sem IPv6. O proxy do EasyPanel alcança o container por IPv4.
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Atrás do proxy do EasyPanel (Traefik) o host/porta/esquema externos não são os do container:
    # redirecionamentos (se houver) devem ser relativos.
    absolute_redirect off;
    port_in_redirect  off;

    charset utf-8;
    charset_types text/css text/plain text/javascript application/javascript;

    # ---- Compressão (tipos já comprimidos, como .woff e .png, ficam de fora) ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # ---- Cabeçalhos (definidos só aqui no nível do server, então valem para todas as respostas) ----
    add_header Cache-Control      $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy    "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options    "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ---- Health check (usado pelo HEALTHCHECK do Dockerfile) ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- PWA ----
    # Garante o tipo correto do manifest mesmo se a tabela de MIME da imagem não o conhecer.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # O service worker precisa ser servido como JavaScript, na raiz (escopo "/") e sempre revalidado
    # (Cache-Control: no-cache vem do `map` acima).
    location = /sw.js {
        default_type text/javascript;
        try_files $uri =404;
    }

    # Bloqueia arquivos ocultos (.git, .env...), exceto .well-known
    location ~ /\.(?!well-known) {
        return 404;
    }

    # ---- Rotas e arquivos estáticos ----
    # Com `trailingSlash: true` o Next exporta cada rota como <rota>/index.html.
    #   /projetos        -> /projetos/index.html   (200, SEM redirecionamento)
    #   /projetos/       -> /projetos/index.html
    #   /projeto/?id=abc -> /projeto/index.html    (o parâmetro ?id= é lido no navegador)
    # Arquivo inexistente => 404 de verdade (sem "fallback para index.html"), para que erros de
    # deploy em assets (JS/CSS/ícones) apareçam em vez de serem mascarados por uma página HTML.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
